name: Build YouLan APK

on:
  push:
    branches:
      - youlan-poc-final-build-20260918

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate source tree
        shell: bash
        run: |
          base64 --decode youlan-final-src.tgz.b64 > /tmp/youlan-final-src.tgz
          tar -xzf /tmp/youlan-final-src.tgz
          test -f YouLan/settings.gradle.kts
          test -f YouLan/app/build.gradle.kts

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls -l "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: YouLan
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f YouLan/app/build/outputs/apk/debug/app-debug.apk
          sha256sum YouLan/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouLan-PoC-debug
          path: YouLan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
