name: Build YouLan v0.3 alpha1 APK

on:
  push:
    branches:
      - youlan-v0.3-alpha1-build1-20260918

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate YouLan v0.3 source tree
        shell: bash
        run: |
          cat youlan-v03-src-00.b64 \
              youlan-v03-src-01.b64 \
              youlan-v03-src-02.b64 \
              youlan-v03-src-03.b64 \
              youlan-v03-src-04.b64 \
              youlan-v03-src-05.b64 \
              youlan-v03-src-06.b64 > /tmp/youlan-v03-src.tgz.b64
          test "$(wc -c < /tmp/youlan-v03-src.tgz.b64)" -eq 27500
          echo "9d370489462617f8907418c8ef46a51dd9bdbe33ef7721a72115ae26b1d23a83  /tmp/youlan-v03-src.tgz.b64" | sha256sum -c -
          base64 --decode /tmp/youlan-v03-src.tgz.b64 > /tmp/youlan-v03-src.tgz
          echo "f3b1faaa1210c623f048ae94a83232196b4bd04fae427e9aafd9638cf495fc07  /tmp/youlan-v03-src.tgz" | sha256sum -c -
          tar -xzf /tmp/youlan-v03-src.tgz
          test -f YouLan/settings.gradle.kts
          grep -q 'versionName = "0.3.0-alpha1"' YouLan/app/build.gradle.kts
          grep -q 'FIXED_SPLIT' YouLan/app/src/main/java/com/john/youlan/navigation/NavigationMode.kt
          grep -q 'SYSTEM_SPLIT' YouLan/app/src/main/java/com/john/youlan/navigation/NavigationMode.kt

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        working-directory: YouLan
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f YouLan/app/build/outputs/apk/debug/app-debug.apk
          sha256sum YouLan/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouLan-PoC-v0.3.0-alpha1-debug
          path: YouLan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
